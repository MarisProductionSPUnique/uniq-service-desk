<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Problem & Knowledge Management</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f5;color:#173047;font:15px system-ui}header{background:#153b36;color:white;padding:20px}header a{color:#b5f4ce}main{max-width:1100px;margin:auto;padding:16px}section{background:white;padding:16px;margin:12px 0;border:1px solid #cbd8d9;border-radius:7px}label{display:block;margin:8px 0}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #a6b8bd;border-radius:4px;max-width:100%}textarea{width:100%;min-height:85px}button{background:#17694e;color:white;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}.scroll{overflow:auto}#msg{color:#a03917}</style></head><body><header><h1>Problem & Knowledge Management</h1><a href="/">Incident Management</a> · <a href="/login.html">Sign in</a><p>Independent ITSM training simulator</p></header><main><p id="msg" role="status"></p><section><h2>Record queue</h2><label>Type <select id="filter"><option value="">All types</option><option>Problem</option><option>KEDB</option><option>SOP</option><option>Runbook</option><option>Article</option></select></label><label>Search <input id="search"></label><button id="refresh">Refresh</button> <button id="new">New record</button><div id="queue" class="scroll"></div></section><section><h2 id="heading">Create record</h2><form id="form"><label>Type <select name="type"><option>Problem</option><option>KEDB</option><option>SOP</option><option>Runbook</option><option>Article</option></select></label><label>Application <select name="application"><option>IBS</option><option>EIMP</option></select></label><label>Title <input name="title" required maxlength="200" style="width:100%"></label><label>State <select name="state"></select></label><label>Related incident ID <input name="incident" maxlength="200"></label><label>Related problem ID <input name="problem" maxlength="200"></label><label>Description <textarea name="description" maxlength="4000"></textarea></label><label>Root cause <textarea name="rca" maxlength="4000"></textarea></label><label>Workaround <textarea name="workaround" maxlength="4000"></textarea></label><label>Solution / procedure steps <textarea name="solution" maxlength="4000"></textarea></label><button>Save record</button></form></section><p>Fictional training data only. Records are temporary and reset on restart.</p></main><script>
const $=id=>document.getElementById(id),f=$('form'),api='/api/support/knowledge-problem';let records=[],selected=null;
function node(tag,t){const n=document.createElement(tag);n.textContent=t??'';return n}
async function call(path='',method='GET',body){const r=await fetch(api+path,{method,cache:'no-store',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error(r.status===401?'Support login required.':'HTTP '+r.status+' — check state, linked record IDs and required fields');return r.json()}
function states(value){const p=f.elements.type.value==='Problem';f.elements.state.replaceChildren(...(p?['Open','Investigating','Known Error','Resolved']:['Draft','Published','Retired']).map(x=>new Option(x,x)));if(value)f.elements.state.value=value;f.elements.problem.disabled=p;if(p)f.elements.problem.value=''}
function reset(){selected=null;f.reset();f.elements.type.disabled=false;states();$('heading').textContent='Create record'}
function open(r){selected=r.id;f.elements.type.disabled=false;f.elements.type.value=r.type;states(r.state);for(const k of ['application','title','incident','problem','description','rca','workaround','solution'])f.elements[k].value=r[k]||'';f.elements.type.disabled=true;$('heading').textContent='Edit '+r.id;f.scrollIntoView({behavior:'smooth'})}
function render(){const table=node('table'),h=node('tr');for(const x of ['Number','Type','Application','Title','State'])h.append(node('th',x));table.append(h);for(const r of records.filter(r=>(!$('filter').value||r.type===$('filter').value)&&[r.id,r.title,r.description].join(' ').toLowerCase().includes($('search').value.toLowerCase())).reverse()){const tr=node('tr'),td=node('td'),b=node('button',r.id);b.onclick=()=>open(r);td.append(b);tr.append(td,...[r.type,r.application,r.title,r.state].map(x=>node('td',x)));table.append(tr)}$('queue').replaceChildren(table)}
async function load(){try{records=await call();render();$('msg').textContent=''}catch(e){records=[];render();$('msg').textContent=e.message}}
f.elements.type.onchange=()=>states();f.onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(f));body.type=f.elements.type.value;try{const r=await call(selected?'/'+selected:'',selected?'PUT':'POST',body);await load();open(r);$('msg').textContent='Saved '+r.id}catch(e){$('msg').textContent=e.message}};$('filter').onchange=render;$('search').oninput=render;$('refresh').onclick=load;$('new').onclick=reset;reset();load();
</script></body></html>
