<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQ Service Desk</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#edf2f4;color:#173b37}header,nav{background:#163c36;color:white;padding:16px}nav a,nav button{color:white;background:transparent;border:0;padding:12px;text-decoration:none;cursor:pointer}main{max-width:1100px;margin:auto;padding:16px}section{background:white;padding:16px;margin:12px 0;border-radius:8px}label{display:block;margin:8px 0}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #aabbb8;border-radius:4px}label input,label select,textarea{width:100%}button{cursor:pointer}button.primary{background:#17694e;color:white}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere}.scroll{overflow:auto}.cards{display:flex;gap:10px;flex-wrap:wrap}.cards div{background:white;padding:18px;flex:1;min-width:100px}</style><header><strong>UNIQ Service Desk</strong> — ITSM Workspace</header><nav><button data-type="">Dashboard</button><a href="/index.html">Incidents</a><button data-type="PRB">Problems</button><button data-type="CHG">Changes</button><button data-type="REQ">Requests</button><a href="/library.html">Knowledge &amp; CMDB</a><a href="/login.html">Sign in</a><button id="logout">Sign out</button></nav><main><h1 id="heading">Dashboard</h1><div id="cards" class="cards"></div><section><select id="app"><option value="">All applications</option><option>IBS</option><option>EIMP</option></select> <input id="search" placeholder="Search records"><p id="msg" role="status"></p><div class="scroll"><table><thead><tr><th>Number</th><th>Application</th><th>Title</th><th>State</th><th>Approval</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="editor" hidden><h2 id="formTitle">New record</h2><form id="form"><label>Application<select name="application"><option>IBS</option><option>EIMP</option></select></label><label>Title<input name="title" required></label><label id="cat">Change type<select name="category"><option>Normal</option><option>Standard</option><option>Emergency</option></select></label><div id="fields"></div><div id="update" hidden><label>State<select name="state"><option>New</option><option>In Progress</option><option>On Hold</option><option>Resolved</option><option>Closed</option></select></label><label>Approval (training simulation)<select name="approval"><option>Pending</option><option>Approved</option><option>Rejected</option></select></label><label>Work note<textarea name="note"></textarea></label><pre id="history"></pre></div><button class="primary">Save record</button> <button type="button" id="reset">New record</button></form></section></main><script>const $=id=>document.getElementById(id),f=$('form'),names={PRB:'Problem Management',CHG:'Change Management',REQ:'Service Requests','':'Dashboard'};let type='',records=[],id=null;const fields={description:'Description',related:'Related record IDs',assignee:'Assigned to',rca:'Root cause',workaround:'Known error / workaround',plan:'Implementation / fulfillment plan',rollback:'Rollback plan',validation:'Validation / resolution'};for(const [k,v] of Object.entries(fields)){const l=document.createElement('label');l.textContent=v;const t=document.createElement('textarea');t.name=k;l.append(t);$('fields').append(l)}async function api(path='',method='GET',body){const r=await fetch('/api/work'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===401){location.href='/login.html';throw Error('Sign in required')}if(!r.ok)throw Error('Request failed: '+r.status+' — check required fields, approval and state');return r.json()}function reset(){id=null;f.reset();f.elements.title.readOnly=false;f.elements.application.disabled=false;f.elements.category.disabled=false;$('update').hidden=true;$('formTitle').textContent='New '+names[type];$('history').textContent=''}function render(){const a=$('app').value,q=$('search').value.toLowerCase();$('rows').replaceChildren();$('cards').replaceChildren();for(const k of ['PRB','CHG','REQ']){const d=document.createElement('div');d.textContent=names[k]+': '+records.filter(x=>x.type===k&&(!a||x.application===a)).length;$('cards').append(d)}for(const t of records.filter(x=>(!type||x.type===type)&&(!a||x.application===a)&&Object.values(x).join(' ').toLowerCase().includes(q))){const tr=document.createElement('tr');for(const k of ['id','application','title','state','approval']){const td=document.createElement('td');td.textContent=t[k];tr.append(td)}tr.onclick=()=>{choose(t.type);id=t.id;for(const k of Object.keys(t))if(f.elements[k])f.elements[k].value=t[k];f.elements.title.readOnly=true;f.elements.application.disabled=true;f.elements.category.disabled=true;$('update').hidden=false;$('history').textContent=t.history;$('formTitle').textContent=t.id};$('rows').append(tr)}}function choose(k){type=k;$('heading').textContent=names[k];$('editor').hidden=!k;$('cat').hidden=k!=='CHG';reset();render()}async function load(){try{records=await api();render()}catch(e){$('msg').textContent=e.message}}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>choose(b.dataset.type));$('app').onchange=render;$('search').oninput=render;$('reset').onclick=reset;f.onsubmit=async e=>{e.preventDefault();try{await api(id?'/'+id:'',id?'PUT':'POST',{...Object.fromEntries(new FormData(f)),type});reset();await load();$('msg').textContent='Record saved'}catch(e){$('msg').textContent=e.message}};$('logout').onclick=async()=>{await fetch('/api/support/logout',{method:'POST'});location.href='/login.html'};load()</script></html>
