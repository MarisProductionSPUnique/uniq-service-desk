<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Requests & CMDB</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f5;color:#173047;font:15px system-ui}header{background:#153b36;color:white;padding:20px}header a{color:#b5f4ce}main{max-width:1100px;margin:auto;padding:16px}section{background:white;padding:16px;margin:12px 0;border:1px solid #cbd8d9;border-radius:7px}label{display:block;margin:8px 0}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #a6b8bd;border-radius:4px;max-width:100%}textarea{width:100%;min-height:85px}button{background:#17694e;color:white;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}.scroll{overflow:auto}#msg{color:#a03917}</style><link rel="stylesheet" href="/workspace.css"></head><body><header><h1>Service Requests &amp; CMDB</h1><a href="/">Incident Management</a> · <a href="/login.html">Sign in</a></header><main><p id="msg" role="status"></p><section><label>Workspace <select id="mode"><option value="requests">Service Catalog & Requests</option><option value="cis">CMDB</option></select></label><input id="search" placeholder="Search records"><button id="refresh">Refresh</button> <button id="new">New record</button><div id="queue" class="scroll"></div></section><section><h2 id="heading">New record</h2><form id="form"><div id="fields"></div><button>Save</button></form><pre id="history" style="white-space:pre-wrap"></pre></section><p>Training only. No actual access changes or batch executions. Records reset on restart.</p></main><script>
const $=id=>document.getElementById(id),f=$('form'),api='/api/support/inventory/';let records=[],catalog=[],selected=null,mode='requests',generation=0;
const transitions={Requested:['Approved','Rejected','Cancelled'],Approved:['In Progress','Cancelled'],'In Progress':['Fulfilled','Cancelled'],Fulfilled:['Closed']};
const app=['IBS','EIMP'];const ciSchema=[['name','CI name'],['application','Application',app],['type','Type',['Web Server','Application Server','Database','Application','API','Batch Job']],['status','Status',['Operational','Degraded','Down','Retired']],['environment','Environment',['DEV','SIT','PROD Training']],['owner','Owner'],['dependsOn','Dependency CI ID'],['description','Description','area']];
function node(tag,t){const n=document.createElement(tag);n.textContent=t??'';return n}
async function call(path,method='GET',body){const r=await fetch(api+path,{method,cache:'no-store',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error(r.status===401?'Support login required.':'HTTP '+r.status+' — check required fields and dependencies');return r.json()}
function open(r){selected=r||null;$('fields').replaceChildren();$('heading').textContent=r?'Record '+r.id:'New record';$('history').textContent=r?.history||'';const schema=mode==='cis'?ciSchema:r?[['state','Next state',transitions[r.state]||[]],['note','Work / approval note','area']]:[['item','Catalog item',catalog],['application','Application',app],['caller','Requested by'],['description','Business justification','area']];if(r&&mode==='requests')$('heading').textContent=r.id+' · '+r.item+' · '+r.state+' · '+r.caller+' · '+r.description;for(const [k,label,kind] of schema){const l=node('label',label+' '),el=node(Array.isArray(kind)?'select':kind==='area'?'textarea':'input');el.name=k;if(Array.isArray(kind))el.replaceChildren(...kind.map(x=>new Option(x,x)));else el.maxLength=kind==='area'?2000:200;if(r&&mode==='cis')el.value=r[k]||'';if(['name','caller','note'].includes(k)||k==='description'&&mode==='requests')el.required=true;if(r&&mode==='cis'&&k==='application')el.disabled=true;l.append(el);$('fields').append(l)}f.querySelector('button').disabled=mode==='requests'&&(r?!transitions[r.state]:!catalog.length)}
function render(){const table=node('table'),h=node('tr');for(const x of ['Number','Name / Item','Application','State / Status'])h.append(node('th',x));table.append(h);for(const r of records.filter(r=>[r.id,r.name,r.item,r.application,r.state,r.status].join(' ').toLowerCase().includes($('search').value.toLowerCase())).reverse()){const tr=node('tr'),td=node('td'),btn=node('button',r.id);btn.onclick=()=>open(r);td.append(btn);tr.append(td,...[r.name||r.item,r.application,r.state||r.status].map(x=>node('td',x)));table.append(tr)}$('queue').replaceChildren(table)}
async function load(){const g=++generation,m=mode;try{const [rows,items]=await Promise.all([call(m),call('catalog')]);if(g!==generation)return;records=rows;catalog=items;render();$('msg').textContent='';if(!selected)open(null)}catch(e){if(g!==generation)return;records=[];catalog=[];render();open(null);$('msg').textContent=e.message}}
f.onsubmit=async e=>{e.preventDefault();const m=mode,body=Object.fromEntries(new FormData(f));if(m==='cis'&&selected)body.application=selected.application;try{const r=await call(m+(selected?'/'+selected.id:''),selected?'PUT':'POST',body);if(mode!==m)return;await load();if(mode!==m)return;open(r);$('msg').textContent='Saved '+r.id}catch(e){$('msg').textContent=e.message}};$('mode').onchange=()=>{mode=$('mode').value;records=[];render();open(null);load()};$('new').onclick=()=>open(null);$('refresh').onclick=load;$('search').oninput=render;open(null);load();
</script></body><script src="/workspace.js"></script></html>
