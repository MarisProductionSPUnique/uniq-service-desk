<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ServiceNow Service Desk Login</title><style>body{font:16px system-ui;background:#eef3f5;color:#153b36}main{max-width:400px;margin:12vh auto;background:white;padding:24px;border-radius:10px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;font:inherit}button{background:#17694e;color:white;border:0}</style><main><h1>ServiceNow Service Desk – Training Simulator</h1><p>Independent training simulator. Not affiliated with ServiceNow.</p><p>IBS Banking · EIMP Insurance</p><form><label>Service desk access key<input type="password" id="key" required autocomplete="off"></label><button>Sign in</button></form><p id="msg" role="status"></p></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const k=document.getElementById('key');try{const r=await fetch('/api/support/login',{method:'POST',headers:{'X-Support-Key':k.value}});k.value='';if(!r.ok)throw Error('Invalid key or access not configured');location.href='/work.html'}catch(e){document.getElementById('msg').textContent=e.message}}</script></html>
