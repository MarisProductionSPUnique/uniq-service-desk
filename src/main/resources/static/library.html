<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQ Knowledge and CMDB</title><style>body{margin:0;font:15px system-ui;background:#edf2f4;color:#173b37}header{background:#163c36;color:white;padding:18px}header a{color:white;margin-left:18px}main{max-width:1100px;margin:auto;padding:18px}section{background:white;padding:18px;margin:12px 0;border-radius:8px}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #aabbb8;border-radius:4px;box-sizing:border-box}label{display:block;margin:9px 0}label input,label select,textarea{width:100%}button{background:#17694e;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}tr[data-id]{cursor:pointer}textarea{min-height:160px}.scroll{overflow:auto}</style><header><strong>UNIQ Service Desk</strong><a href="/work.html">Dashboard</a><a href="/index.html">Incidents</a><a href="/login.html">Sign in</a></header><main><h1>Knowledge Base &amp; CMDB</h1><section><select id="app"><option value="">All applications</option><option>IBS</option><option>EIMP</option></select> <select id="kind"><option value="">All types</option><option>SOP</option><option>KEDB</option><option>RUNBOOK</option><option>CI</option></select> <input id="q" placeholder="Search documents and assets"><p id="msg" role="status"></p><div class="scroll"><table><thead><tr><th>ID</th><th>Application</th><th>Type</th><th>Title</th><th>Status</th><th>Owner</th></tr></thead><tbody id="rows"></tbody></table></div></section><section><h2 id="heading">New record</h2><form id="form"><label>Application<select name="application"><option>IBS</option><option>EIMP</option></select></label><label>Type<select name="type"><option>SOP</option><option>KEDB</option><option>RUNBOOK</option><option>CI</option></select></label><label>Title<input name="title" required></label><label>Owner<input name="owner"></label><label>Status<select name="state"><option>Draft</option><option>Published</option><option>Retired</option></select></label><label>Document content / configuration details<textarea name="body"></textarea></label><label>Related record IDs / dependencies<input name="related"></label><button>Save record</button> <button type="button" id="new">New record</button></form></section></main><script>const $=x=>document.getElementById(x),f=$('form');let items=[],id=null;async function api(path='',method='GET',body){const r=await fetch('/api/library'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===401){location.href='/login.html';throw Error('Sign in required')}if(!r.ok)throw Error('Request failed: '+r.status);return r.json()}function reset(){id=null;f.reset();f.elements.type.disabled=false;$('heading').textContent='New record'}function render(){$('rows').replaceChildren();for(const t of items.filter(t=>(!$('app').value||t.application===$('app').value)&&(!$('kind').value||t.type===$('kind').value)&&Object.values(t).join(' ').toLowerCase().includes($('q').value.toLowerCase()))){const tr=document.createElement('tr');tr.dataset.id=t.id;for(const k of ['id','application','type','title','state','owner']){const td=document.createElement('td');td.textContent=t[k];tr.append(td)}tr.onclick=()=>{reset();id=t.id;for(const k of Object.keys(t))if(f.elements[k])f.elements[k].value=t[k];f.elements.type.disabled=true;$('heading').textContent=t.id;f.scrollIntoView({behavior:'smooth'})};$('rows').append(tr)}}async function load(){try{items=await api();render()}catch(e){$('msg').textContent=e.message}}$('app').onchange=render;$('kind').onchange=render;$('q').oninput=render;$('new').onclick=reset;f.onsubmit=async e=>{e.preventDefault();try{await api(id?'/'+id:'',id?'PUT':'POST',{...Object.fromEntries(new FormData(f)),type:f.elements.type.value});reset();await load();$('msg').textContent='Record saved'}catch(e){$('msg').textContent=e.message}};load()</script></html>
