<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Management</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f5;color:#173047;font:15px system-ui}header{background:#153b36;color:white;padding:20px}header a{color:#b5f4ce}main{max-width:1100px;margin:auto;padding:16px}section{background:white;padding:16px;margin:12px 0;border:1px solid #cbd8d9;border-radius:7px}label{display:block;margin:8px 0}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #a6b8bd;border-radius:4px;max-width:100%}textarea{width:100%;min-height:85px}button{background:#17694e;color:white;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}.scroll{overflow:auto}#msg{color:#a03917}</style><link rel="stylesheet" href="/workspace.css"></head><body><header><h1>Change Management</h1><a href="/">Incident Management</a> · <a href="/knowledge.html">Knowledge</a> · <a href="/login.html">Sign in</a></header><main><p id="msg" role="status"></p><section><h2>Change queue</h2><input id="search" placeholder="Search changes"><button id="refresh">Refresh</button> <button id="new">New change</button><div id="queue" class="scroll"></div></section><section><h2 id="heading">Create change</h2><form id="form"><div id="fields"></div><button>Save change</button></form><h3>History</h3><pre id="history" style="white-space:pre-wrap"></pre></section><p>Training only. Shared support login; approval is simulated. Records reset on restart.</p></main><script>
const $=id=>document.getElementById(id),f=$('form'),api='/api/support/changes';let records=[],selected=null;
const schema=[['type','Change type',['Standard','Normal','Emergency']],['application','Application',['IBS','EIMP']],['title','Short description'],['risk','Risk',['Low','Medium','High']],['impact','Impact assessment','area'],['implementation','Implementation plan','area'],['rollback','Rollback plan','area'],['start','Window start (UTC ISO, e.g. 2026-12-04T16:30:00Z)'],['end','Window end (UTC ISO)'],['incident','Related incident ID'],['approvalNote','Approval / rejection rationale','area'],['review','Post-implementation review','area'],['outcome','Outcome',['','Successful','Failed','Rolled Back']],['state','Next state',['Draft']]];
const locked=['type','application','title','risk','impact','implementation','rollback','start','end','incident'];
const transitions={Draft:['Draft','Assessment','Cancelled'],Assessment:['Assessment','Approval','Cancelled'],Approval:['Approval','Scheduled','Rejected'],Scheduled:['Scheduled','Implementation','Cancelled'],Implementation:['Implementation','Review'],Review:['Review','Closed']};
function node(tag,t){const n=document.createElement(tag);n.textContent=t??'';return n}
for(const [key,label,kind] of schema){const l=node('label',label+' '),el=node(Array.isArray(kind)?'select':kind==='area'?'textarea':'input');el.name=key;if(Array.isArray(kind))el.replaceChildren(...kind.map(x=>new Option(x||'Select',x)));else el.maxLength=kind==='area'?4000:200;if(key==='title')el.required=true;l.append(el);$('fields').append(l)}
async function call(path='',method='GET',body){const r=await fetch(api+path,{method,cache:'no-store',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error(r.status===401?'Support login required.':'HTTP '+r.status+' — check transition, plans, UTC window and approval');return r.json()}
function open(r){selected=r?.id||null;f.reset();for(const [k] of schema){const el=f.elements[k];el.disabled=false;if(k!=='state'&&r)el.value=r[k]||''}const state=r?.state||'Draft',options=r?(transitions[state]||[state]):['Draft'];f.elements.state.replaceChildren(...options.map(x=>new Option(x,x)));if(r&&!['Draft','Assessment'].includes(state))for(const k of locked)f.elements[k].disabled=true;if(r&&!['Draft','Assessment','Approval'].includes(state))f.elements.approvalNote.disabled=true;f.querySelector('button').disabled=!!r&&!transitions[state];$('heading').textContent=r?'Edit '+r.id:'Create change';$('history').textContent=r?.history||''}
function render(){const table=node('table'),h=node('tr');for(const x of ['Number','Type','Application','Title','Risk','State'])h.append(node('th',x));table.append(h);for(const r of records.filter(r=>[r.id,r.title,r.application,r.state].join(' ').toLowerCase().includes($('search').value.toLowerCase())).reverse()){const tr=node('tr'),td=node('td'),btn=node('button',r.id);btn.onclick=()=>open(r);td.append(btn);tr.append(td,...[r.type,r.application,r.title,r.risk,r.state].map(x=>node('td',x)));table.append(tr)}$('queue').replaceChildren(table)}
async function load(){try{records=await call();render();$('msg').textContent=''}catch(e){records=[];render();$('msg').textContent=e.message}}
f.onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(schema.map(([k])=>[k,f.elements[k].value]));try{const r=await call(selected?'/'+selected:'',selected?'PUT':'POST',body);await load();open(r);$('msg').textContent='Saved '+r.id}catch(e){$('msg').textContent=e.message}};$('new').onclick=()=>open(null);$('refresh').onclick=load;$('search').oninput=render;open(null);load();
</script></body><script src="/workspace.js"></script></html>
