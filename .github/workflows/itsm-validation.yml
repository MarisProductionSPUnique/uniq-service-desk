name: ITSM validation
on:
  push:
    branches: [feature/consolidated-itsm-upgrade]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn --batch-mode verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess,tempfile
          for p in pathlib.Path('src/main/resources/static').rglob('*.html'):
              for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',p.read_text(),re.S|re.I):
                  with tempfile.NamedTemporaryFile(suffix='.js',mode='w') as f:
                      f.write(script); f.flush()
                      subprocess.run(['node','--check',f.name],check=True)
          PY
