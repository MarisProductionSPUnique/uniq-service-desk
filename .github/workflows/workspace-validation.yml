name: Workspace validation
on:
  push:
    branches: [feature/itsm-workspace-layout]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B verify
      - run: |
          node --check src/main/resources/static/workspace.js
          python3 - <<'PY'
          import pathlib,re,tempfile,subprocess
          root=pathlib.Path('src/main/resources/static')
          for name in ['index','knowledge','changes','inventory','operations']:
              page=(root/(name+'.html')).read_text()
              assert '/workspace.css' in page and '/workspace.js' in page
              for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',page,re.S|re.I):
                  with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as f:
                      f.write(script);f.flush()
                      subprocess.run(['node','--check',f.name],check=True)
          PY
